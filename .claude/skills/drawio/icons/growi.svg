<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Growi Wiki: open book/wiki icon in Growi green -->
  <rect x="4" y="8" width="40" height="32" rx="2" fill="#1B7D3A"/>
  <!-- Book spine -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="#fff" stroke-width="1.5"/>
  <!-- Left page lines -->
  <line x1="9" y1="15" x2="20" y2="15" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="9" y1="19" x2="20" y2="19" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="9" y1="23" x2="18" y2="23" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="9" y1="27" x2="20" y2="27" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="9" y1="31" x2="16" y2="31" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <!-- Right page lines -->
  <line x1="28" y1="15" x2="39" y2="15" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="28" y1="19" x2="39" y2="19" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="28" y1="23" x2="37" y2="23" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="28" y1="27" x2="39" y2="27" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <line x1="28" y1="31" x2="35" y2="31" stroke="#fff" stroke-width="1" opacity="0.8"/>
  <!-- G label -->
  <text x="24" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#1B7D3A" font-weight="bold">GROWI</text>
</svg>
