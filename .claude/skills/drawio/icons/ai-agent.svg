<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- AI Agent: robot/circuit brain icon -->
  <!-- Head outline -->
  <rect x="10" y="8" width="28" height="24" rx="4" fill="#7C3AED"/>
  <!-- Eyes -->
  <circle cx="18" cy="18" r="3" fill="#fff"/>
  <circle cx="30" cy="18" r="3" fill="#fff"/>
  <circle cx="18" cy="18" r="1.5" fill="#7C3AED"/>
  <circle cx="30" cy="18" r="1.5" fill="#7C3AED"/>
  <!-- Mouth/speaker -->
  <rect x="16" y="25" width="16" height="3" rx="1" fill="#fff" opacity="0.8"/>
  <!-- Antenna -->
  <line x1="24" y1="8" x2="24" y2="3" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="24" cy="2" r="2" fill="#A78BFA"/>
  <!-- Ears/sensors -->
  <rect x="5" y="14" width="5" height="8" rx="2" fill="#A78BFA"/>
  <rect x="38" y="14" width="5" height="8" rx="2" fill="#A78BFA"/>
  <!-- Body connection -->
  <rect x="18" y="32" width="12" height="4" rx="1" fill="#7C3AED"/>
  <!-- Circuit patterns on body -->
  <line x1="20" y1="36" x2="20" y2="42" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="24" y1="36" x2="24" y2="44" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="28" y1="36" x2="28" y2="42" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="20" cy="43" r="1.5" fill="#A78BFA"/>
  <circle cx="24" cy="45" r="1.5" fill="#A78BFA"/>
  <circle cx="28" cy="43" r="1.5" fill="#A78BFA"/>
</svg>
